name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_secrets.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: docker compose up --build --detach
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - run: docker compose --profile test run --rm integration-tests
      - if: always()
        run: docker compose down --volumes

  deployment-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev,deploy]"
      - run: python -m pytest tests/test_sae_deploy.py

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  publish-acr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, terraform, deployment-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACR_REGISTRY: crpi-pcn8j07ylq6rgqgz.cn-beijing.personal.cr.aliyuncs.com
      ACR_IMAGE: crpi-pcn8j07ylq6rgqgz.cn-beijing.personal.cr.aliyuncs.com/duyuan-heritageflow/heritageflow
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_IMAGE }}:latest
            ${{ env.ACR_IMAGE }}:${{ github.sha }}

  deploy-sae:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SAE_DEPLOY_ENABLED == 'true'
    needs: [publish-acr]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: sae-evaluation
    concurrency:
      group: heritageflow-sae-deployment
      cancel-in-progress: false
    env:
      SAE_APP_ID: ${{ vars.SAE_APP_ID || '1187c616-c49b-4b0f-8cec-2f9e45989acd' }}
      SAE_REGION: cn-beijing
      SAE_BASE_URL: ${{ vars.SAE_BASE_URL || 'http://182.92.2.36' }}
      SAE_CHECK_ONLY: ${{ vars.SAE_CHECK_ONLY || 'false' }}
      ACR_IMAGE: crpi-pcn8j07ylq6rgqgz.cn-beijing.personal.cr.aliyuncs.com/duyuan-heritageflow/heritageflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[deploy]"
      - name: Deploy immutable image and verify release
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.SAE_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.SAE_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ secrets.SAE_SECURITY_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          check_args=()
          if [ "$SAE_CHECK_ONLY" = "true" ]; then
            check_args+=(--check-only)
          fi
          python scripts/deploy_sae.py \
            --app-id "$SAE_APP_ID" \
            --region "$SAE_REGION" \
            --image "$ACR_IMAGE:$RELEASE_COMMIT" \
            --commit "$RELEASE_COMMIT" \
            --base-url "$SAE_BASE_URL" \
            --output results/.local/sae-deployment.json \
            "${check_args[@]}"
      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: results/.local/sae-deployment.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
