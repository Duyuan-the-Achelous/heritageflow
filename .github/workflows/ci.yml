name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_secrets.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: docker compose up --build --detach
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - run: docker compose --profile test run --rm integration-tests
      - if: always()
        run: docker compose down --volumes

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  publish-acr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACR_REGISTRY: crpi-pcn8j07ylq6rggqgz.cn-beijing.personal.cr.aliyuncs.com
      ACR_IMAGE: crpi-pcn8j07ylq6rggqgz.cn-beijing.personal.cr.aliyuncs.com/duyuan-heritageflow/heritageflow
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.ACR_IMAGE }}:latest
            ${{ env.ACR_IMAGE }}:${{ github.sha }}
