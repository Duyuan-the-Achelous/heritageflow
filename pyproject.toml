[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heritageflow"
version = "0.1.0"
description = "Multi-tenant reservation and admission-control platform prototype"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "moto[dynamodb]>=5.0,<6",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a running DynamoDB Local endpoint",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heritageflow = ["static/*"]

